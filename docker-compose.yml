services:
  api:
    build: ./backend
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp
    volumes: ["./backend:/var/www"]
    ports: ["8000:8000"]
    command: sh -c "composer install --no-interaction && (test -f .env || cp .env.example .env) && php artisan key:generate --no-interaction && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
  web:
    image: node:24
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
    volumes: ["./frontend:/app"]
    ports: ["4200:4200"]
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --proxy-config proxy.conf.json"
    depends_on: [api]
